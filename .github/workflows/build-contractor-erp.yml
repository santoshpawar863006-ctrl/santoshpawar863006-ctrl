name: Build Contractor ERP EXE

on:
  push:
    branches: ["contractor-erp-build"]
    paths:
      - "contractor-erp/**"
      - ".github/workflows/build-contractor-erp.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: contractor-erp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        working-directory: contractor-erp
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name "Contractor ERP" --collect-all reportlab --collect-all openpyxl app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Contractor-ERP-Windows
          path: contractor-erp/dist/Contractor ERP.exe
          if-no-files-found: error
