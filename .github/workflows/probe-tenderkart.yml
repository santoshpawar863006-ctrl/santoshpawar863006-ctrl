name: Probe TenderKart
on:
  push:
    branches: [probe-tenderkart]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
          echo "== search API (browser-like, Origin tenderone.online)"
          curl -sS -m 30 -D - -o /tmp/s.json -A "$UA" -H 'Accept: application/json' -H 'Origin: https://tenderone.online' \
            'https://tenderkart.in/api/v1/tenders?keywords=Karnataka&state=Karnataka&limit=2' | grep -iE '^HTTP|access-control|content-type|server|cf-mitigated'
          head -c 400 /tmp/s.json; echo
          ID=$(python3 -c "import json;d=json.load(open('/tmp/s.json'));print(d['data'][0]['id'])" 2>/dev/null)
          echo "first id: $ID"
          if [ -n "$ID" ]; then
            echo "== detail API"
            curl -sS -m 30 -D - -o /tmp/d.json -A "$UA" -H 'Accept: application/json' -H 'Origin: https://tenderone.online' \
              "https://tenderkart.in/api/v1/tenders/$ID" | grep -iE '^HTTP|access-control|content-type'
            python3 -c "import json;d=json.load(open('/tmp/d.json'));print(sorted(d.keys())[:40])" || head -c 300 /tmp/d.json
          fi
          echo "== CORS preflight"
          curl -sS -m 30 -D - -o /dev/null -X OPTIONS -H 'Origin: https://tenderone.online' -H 'Access-Control-Request-Method: GET' \
            'https://tenderkart.in/api/v1/tenders?keywords=x' | grep -iE '^HTTP|access-control'
